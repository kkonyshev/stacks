networks:
  default:
    name: stacks

services:
  stacks:
    build: .
    image: stacks:latest
    container_name: stacks
    stop_signal: SIGTERM
    stop_grace_period: 30s
    ports:
      # Change the left value if 7788 is already taken
      - "7788:7788"
    volumes:
      # REQUIRED: Change these paths to match your system
      # For Windows, use / instead of \, for instance C:/path/to/downloads
      - "/path/to/config:/opt/stacks/config"       # Configuration folder
      - "/path/to/download:/opt/stacks/download"   # Downloaded files
      - "/path/to/logs:/opt/stacks/logs"           # Log files

      # OPTIONAL: Separate incomplete folder (requires setting in Stacks UI)
      # Uncomment and set incomplete_folder_path to "/incomplete" in the UI
      # - "/path/to/incomplete:/opt/stacks/incomplete"
    restart: unless-stopped
    environment:
      # Only applies to first run, after that the config.yaml has all relevant info
      - USERNAME=admin    # Feel free to change this
      - PASSWORD=stacks   # Please change this!
      # Uncomment to reset admin password to above values
      # - RESET_ADMIN=true

      # If you're using the included flaresolverr, this will automatically connect it.
      # If you already got it running, you can change this address to match your local
      # setup, or delete this variable and set it up inside Stacks.
      - SOLVERR_URL=flaresolverr:8191

      # Set your timezone, a comprehensive list can be found here:
      # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      - TZ=UTC

  # Optional, but recommended, bypasses Cloudflare and DDoS-Guard to allow slow download
  # to go more smoothly
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    ports:
      - '8191:8191'
    environment:
      - LOG_LEVEL=info
    restart: unless-stopped

  # Optional: powers the "Find Similar" and description-based search features
  # (see tools/zlib-index/README and the similar_search config section), and
  # can also serve the bulk index-building scripts in tools/zlib-index/.
  # CPU-only here works fine for live search queries; for bulk embedding
  # (millions of books) it's slower than a GPU host but still practical -
  # measured ~159/s at concurrency>=8 on a 16-core host (vs ~270/s on an
  # RTX 5070 Ti), so the whole pipeline is runnable via docker compose alone
  # without needing GPU passthrough. Port 11435 is published (not 11434, to
  # avoid clashing with a host-level Ollama install) so tools/zlib-index/
  # scripts running directly on the host can reach it too.
  #
  # Model storage defaults to a project-local folder (self-contained, pull
  # your own models with `docker compose exec ollama ollama pull <model>`).
  # To reuse an existing host Ollama installation's models instead (skip
  # re-downloading), set OLLAMA_MODELS_PATH in a .env file next to this
  # compose file, e.g. OLLAMA_MODELS_PATH=/path/to/existing/ollama/models
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11435:11434"
    environment:
      - OLLAMA_MODELS=/models
    volumes:
      - "${OLLAMA_MODELS_PATH:-./data/ollama-models}:/models:z"
    restart: unless-stopped